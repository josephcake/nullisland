name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack only, do not publish
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const p=require('./package.json'); const tag=process.env.GITHUB_REF_NAME; if ('v'+p.version !== tag) { console.error('tag ' + tag + ' does not match package ' + p.version); process.exit(1); }"
      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public
