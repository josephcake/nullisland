<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nullisland — ArcGIS layers on Google Maps</title>
    <style>
      html,
      body,
      #map {
        height: 100%;
        margin: 0;
      }
      #panel {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 5;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(17, 24, 39, 0.9);
        color: #fff;
        font: 500 13px/1.5 system-ui, -apple-system, sans-serif;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      #panel label {
        display: flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <label><input id="toggle" type="checkbox" checked /> Service requests (points, PBF)</label>
    </div>

    <!-- Replace YOUR_API_KEY. A Map ID is optional but recommended. -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&v=weekly&callback=initMap"
      async
      defer
    ></script>

    <script type="module">
      import {NullIsland} from 'https://esm.sh/nullisland';

      window.initMap = async () => {
        const map = new google.maps.Map(document.getElementById('map'), {
          center: {lat: 34.055, lng: -117.18},
          zoom: 13,
        });

        const arc = new NullIsland({
          map,
          layers: [
            {
              id: 'service-requests',
              title: 'Service requests',
              url: 'https://sampleserver6.arcgisonline.com/arcgis/rest/services/ServiceRequest/FeatureServer',
              color: '#e4572e',
              minZoom: 11,
            },
            {
              id: 'usa-states',
              title: 'US states',
              // A MapServer: this is rendered by the server as an image.
              url: 'https://sampleserver6.arcgisonline.com/arcgis/rest/services/USA/MapServer',
              opacity: 0.65,
            },
          ],
          indicator: true,
        });

        arc.on('error', (error) => console.error('[nullisland]', error));
        arc.on('status', ({loading}) => console.log('[nullisland] loading:', loading));

        await arc.ready;
        console.log('layers', arc.layers.map((layer) => [layer.id, layer.mode]));

        document.getElementById('toggle').addEventListener('change', (event) => {
          arc.getLayer('service-requests')?.setVisible(event.target.checked);
        });
      };
    </script>
  </body>
</html>
